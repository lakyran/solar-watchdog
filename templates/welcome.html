<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Unisolartech Watchdog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-yellow-100 via-blue-100 to-blue-300 min-h-screen text-gray-800 relative">
    <!-- Decorative sun icon in the top left -->
    <div class="absolute left-0 top-0 m-6 z-0">
        <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="30" cy="30" r="18" fill="#FDE68A"/>
            <g stroke="#F59E42" stroke-width="2">
                <line x1="30" y1="4" x2="30" y2="16"/>
                <line x1="30" y1="44" x2="30" y2="56"/>
                <line x1="4" y1="30" x2="16" y2="30"/>
                <line x1="44" y1="30" x2="56" y2="30"/>
                <line x1="12.93" y1="12.93" x2="20.49" y2="20.49"/>
                <line x1="39.51" y1="39.51" x2="47.07" y2="47.07"/>
                <line x1="12.93" y1="47.07" x2="20.49" y2="39.51"/>
                <line x1="39.51" y1="20.49" x2="47.07" y2="12.93"/>
            </g>
        </svg>
    </div>
    <div class="container mx-auto px-4 py-16 max-w-xl text-center relative z-10">
        <div class="bg-white bg-opacity-90 shadow-md rounded-lg p-10">
            <h1 class="text-4xl font-bold text-indigo-700 mb-6">Welcome to Unisolartech Watchdog</h1>
            <p class="text-lg mb-10 text-gray-600">Monitor your solar system's health, efficiency, and disruptions with ease.</p>
            <div class="flex flex-col gap-6 items-center">
                <a href="/efficiency/view" class="w-full md:w-2/3 px-6 py-4 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 text-lg font-semibold transition">System Efficiency Snapshot</a>
                <a href="/disruptions/view" class="w-full md:w-2/3 px-6 py-4 bg-yellow-500 text-white rounded-lg shadow hover:bg-yellow-600 text-lg font-semibold transition">Device Disruptions</a>
            </div>
        </div>
        <footer class="mt-16 text-gray-400 text-xs">&copy; 2025 Unisolartech. All rights reserved.</footer>
    </div>
</body>
</html>
