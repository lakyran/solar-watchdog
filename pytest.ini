[pytest]
# Put the repo root and scripts/ on sys.path so tests can import app code
# (`from src.x import ...`, `from services.x import ...`, `from routes.x import ...`)
# and script modules (`from check_power_gen_history_gaps import ...`) without per-test
# sys.path hacks or a root conftest.py.
pythonpath = scripts .
testpaths = tests
